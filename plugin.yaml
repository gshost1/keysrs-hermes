name: keysrs
version: 0.1.0
api_version: 1
description: >-
  Keysrs secret source: Hermes calls providers through the local Keysrs
  gateway with a scoped, expiring client token, so the real API key never
  enters Hermes.
author: George Shostakovich
license: MIT
homepage: https://keysrs.com
tags: [secrets, macos, keychain, gateway]
requires_hermes: ">=0.20.4"
provides_tools: [keysrs_keys, keysrs_request]
provides_hooks: [transform_api_error_classification, pre_tool_call, transform_tool_result]
